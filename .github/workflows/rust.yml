name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"


    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: clippy
          cache: true
      - name: Build
        run: cargo build --verbose --target ${{ matrix.target }}

      - name: Test
        run: cargo test --verbose --target ${{ matrix.target }}
      
      - name: Clippy
        run: cargo clippy --target ${{ matrix.target }}

      - name: Test (release)
        run: cargo test --release --locked --target ${{ matrix.target }}
